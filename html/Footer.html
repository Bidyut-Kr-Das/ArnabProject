<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <section class="footer">contact us

        
       <div class="footer_main flex justify-SE">
           <div class="left flex justify-C align-C flex-1">
               <div class="text flex">
                    <h1 style="color: white;"> Menu</h1>
                    <a href="">HOME</a>
                    <a href="">ABOUT</a>
                    <a href="">SERVICE</a>
                    <a href="">CONTACT</a> 

               </div>
               
           </div>
           <div class="right flex justify-C flex-1">
                
                    <div class="controls">
                        <label class="control-label" for="contact-name">Name</label>
                        <input id="contact-name" name="contactName" placeholder="Your name" class="form-control requiredField" data-new-placeholder="Your name" type="text" data-error-empty="Please enter your name">
                <i class="fa fa-user"></i>
                </div>
                    <div class=" controls">
                        <label class="control-label" for="contact-mail">Email</label>
                    <input id="contact-mail" name="email" placeholder="Your email" class="form-control requiredField" data-new-placeholder="Your email" type="email" data-error-empty="Please enter your email" data-error-invalid="Invalid email address">
                    <i class="fa fa-envelope"></i>
                    </div>
                      <div class="controls">
                        <label class="control-label" for="contact-name">Phone number</label>
                    <input id="contact-name" name="contactName" placeholder="Your Phone number" class="form-control requiredField" data-new-placeholder="Your name" type="text" data-error-empty="Please enter your name">
                    <i class="fa fa-user"></i>
                    </div>
                        <div class="controls">
                            <label class="control-label" for="contact-name">Reason</label>
                        <input id="contact-name" name="contactName" placeholder="Your Reason" class="form-control requiredField" data-new-placeholder="Your name" type="text" data-error-empty="Please enter your name">
                        <i class="fa fa-user"></i>
                        </div>
                      <div class="controls">
                        <label class="control-label" for="contact-message">Message</label>
                      <textarea id="contact-message" name="comments"  placeholder="Your message" class="form-control requiredField" data-new-placeholder="Your message" rows="6" data-error-empty="Please enter your message"></textarea>
                      <i class="fa fa-comment"></i>
                    </div>
           </div>

       </div>
    </section> 
        <script src="" async defer></script>
    </body>
</html>
