<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      ul {
        margin: 0px;
        padding: 0px;
      }

      .footer-section {
        background-color: black;
        position: relative;
      }

      .footer-cta {
        border-bottom: 1px solid #3f42d1;
      }

      .single-cta i {
        color: #ff5e14;
        font-size: 30px;
        float: left;
        margin-top: 8px;
      }

      .cta-text {
        padding-left: 15px;
        display: inline-block;
      }

      .cta-text h4 {
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 2px;
      }

      .cta-text span {
        color: #6c6dd6;
        font-size: 15px;
      }

      .footer-content {
        position: relative;
        z-index: 2;
      }

      .footer-pattern img {
        position: absolute;
        top: 0;
        left: 0;
        height: 330px;
        background-size: cover;
        background-position: 100% 100%;
      }

      .footer-logo {
        margin-bottom: 30px;
      }

      .footer-logo img {
        max-width: 200px;
      }

      .footer-text p {
        margin-bottom: 14px;
        font-size: 14px;
        color: white;
        line-height: 28px;
      }

      .footer-social-icon span {
        color: #fff;
        display: block;
        font-size: 20px;
        font-weight: 700;
        font-family: "Poppins", sans-serif;
        margin-bottom: 20px;
      }

      .footer-social-icon a {
        color: #fff;
        font-size: 16px;
        margin-right: 15px;
      }

      .footer-social-icon i {
        height: 40px;
        width: 40px;
        text-align: center;
        line-height: 38px;
        border-radius: 50%;
      }

      .facebook-bg {
        background: #3b5998;
      }

      .twitter-bg {
        background: #55acee;
      }

      .google-bg {
        background: #dd4b39;
      }

      .footer-widget-heading h3 {
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 40px;
        position: relative;
      }

      .footer-widget-heading h3::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: -15px;
        height: 2px;
        width: 50px;
        background: #ff5e14;
      }

      .footer-widget ul li {
        /* display: inline-block;
float: left; */
        width: 50%;
        margin-bottom: 12px;
      }

      .footer-widget ul li a:hover {
        color: #ff5e14;
      }

      .footer-widget ul li a {
        color: white;
        text-transform: capitalize;
      }

      .subscribe-form {
        position: relative;
        overflow: hidden;
      }

      .subscribe-form input {
        width: 100%;
        padding: 14px 28px;
        background: white;
        border: 1px solid #523ca2;
        color: black;
      }

      .subscribe-form button {
        position: absolute;
        right: 0;
        background: #ff5e14;
        padding: 13px 20px;
        border: 1px solid #ff5e14;
        top: 0;
      }

      .subscribe-form button i {
        color: #fff;
        font-size: 22px;
        transform: rotate(-6deg);
      }

      .copyright-area {
        background: #8e8fb9;
        padding: 25px 0;
      }

      .copyright-text p {
        margin: 0;
        font-size: 14px;
        color: black;
      }

      .copyright-text p a {
        color: #ff5e14;
      }

      .footer-menu li {
        display: inline-block;
        margin-left: 20px;
      }

      .footer-menu li:hover a {
        color: #ff5e14;
      }

      .footer-menu li a {
        font-size: 14px;
        color: #3f42d1;
      }
    </style>
  </head>
  <body>
    <footer class="footer-section">
      <div class="container">
        <div class="footer-content pt-5 pb-5">
          <div class="row">
            <div class="col-xl-4 col-lg-4 mb-50">
              <div class="footer-widget">
                <div class="footer-social-icon">
                  <span>Follow us</span>
                  <a href="https://www.instagram.com/countryside_frost/"
                    ><i class="fab fa-facebook-f facebook-bg"></i
                  ></a>
                  <a href="#"><i class="fab fa-twitter twitter-bg"></i></a>
                  <a href="#"><i class="fab fa-google-plus-g google-bg"></i></a>
                </div>
              </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-6 mb-30">
              <div class="footer-widget">
                <div class="footer-widget-heading">
                  <h3>Useful Links</h3>
                </div>
                <ul>
                  <li><a href="#">Home</a></li>
                  <li><a href="#">About us</a></li>
                  <li><a href="#">services</a></li>
                  <li><a href="#">Contact Us</a></li>
                </ul>
              </div>
            </div>
            <div class="col-xl-4 col-lg-4 col-md-6 mb-50">
              <div class="footer-widget">
                <div class="footer-widget-heading">
                  <h3>Contact Us</h3>
                </div>
                <div class="footer-text mb-25">
                  <p>For any queries</p>
                </div>
                <div class="subscribe-form">
                  <form action="#">
                    <input type="text" placeholder="Email Address" />
                    <button><i class="fab fa-telegram-plane"></i></button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="copyright-area">
        <div class="container">
          <div class="row">
            <div class="col-xl-6 col-lg-6 text-center text-lg-left">
              <div class="copyright-text">
                <p>Copyright &copy; 2018, All Right Reserved</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
